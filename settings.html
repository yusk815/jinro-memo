<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>設定</title>
<style>
    body {
        font-family: sans-serif;
        background: #f5f5f5;
        padding: 20px;
    }
    .container {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0,0,0,0.1);
        max-width: 480px;
        margin: auto;
    }
    h2 {
        margin-top: 0;
    }
    .back-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background: #4a90e2;
        color: white;
        border-radius: 8px;
        text-decoration: none;
    }
</style>
</head>
<body>

<div class="container">
    <h2>設定</h2>

    <!-- テーマ設定 -->
    <h3>明るさを変更できます</h3>
    <label><input type="radio" name="theme" value="light"> ライト</label><br>
    <label><input type="radio" name="theme" value="dark"> ダーク</label>

    <hr>



    <a href="game.html" class="back-btn">ゲーム画面へ戻る</a>
</div>

<script>
/* 保存されている設定を読み込む */
window.onload = () => {
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
        document.querySelector(`input[value="${savedTheme}"]`).checked = true;
    }


};

/* テーマ変更を保存 */
document.querySelectorAll('input[name="theme"]').forEach(radio => {
    radio.addEventListener("change", () => {
        localStorage.setItem("theme", radio.value);
    });
});


</script>

</body>
</html>
