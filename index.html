<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; URL=start.html">
    <title>人狼メモアプリ - スタート</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            width: 320px;
        }
        h1 {
            margin-bottom: 30px;
            font-size: 24px;
        }
        a button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #4a90e2;
            color: white;
            transition: 0.2s;
        }
        a button:hover {
            background: #357ac9;
        }
        .sub-btn {
            background: #888;
        }
        .sub-btn:hover {
            background: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>人狼メモアプリ</h1>

    <a href="game.html"><button>ゲーム開始</button></a>
    <a href="settings.html"><button class="sub-btn">設定</button></a>
    <a href="help.html"><button class="sub-btn">説明を見る</button></a>
</div>

</body>
</html>
