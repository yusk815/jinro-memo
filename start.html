<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>人狼ノート - スタート</title>

<style>
  :root{
    --accent:#d9b26f;      /* ゴールド系 */
    --accent2:#f3d9a2;     /* 明るいゴールド */
    --bg-a:#0f1724;
    --bg-b:#1f2a44;
    --text:#eaf0ff;
  }

  html,body{
    height:100%;
    margin:0;
    font-family: "Meiryo","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    background: linear-gradient(135deg,var(--bg-a) 0%, #1b2540 50%, #2b1b3a 100%);
    color:var(--text);
    overflow:hidden;
  }

  .start-screen{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    padding:28px;
  }

  .bg-blob{
    position:absolute; inset:-10%; z-index:0; filter: blur(36px) saturate(120%);
    background: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08), transparent 8%),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.06), transparent 12%),
                linear-gradient(120deg, rgba(10,14,30,0.6), rgba(30,18,40,0.6));
    animation: blobMove 18s linear infinite;
  }
  @keyframes blobMove{
    0%{ transform: translateY(0) scale(1.02); }
    50%{ transform: translateY(-6px) scale(1.04); }
    100%{ transform: translateY(0) scale(1.02); }
  }

  .start-inner{
    position:relative; z-index:2; width:min(980px,94%); max-width:1100px;
    background: rgba(255,255,255,0.03);
    border-radius:14px; padding:28px 36px;
    box-shadow: 0 18px 60px rgba(2,6,23,0.6);
    text-align:center; backdrop-filter: blur(6px);
  }

  /* ★ タイトル：控えめロゴ＋映画風の重厚感 */
  .title{
    margin:0;
    font-size:58px;
    font-weight:800;
    letter-spacing:1.4px;
    font-family: "Meiryo","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;

    /* ゴールド系の控えめグラデーション */
    background: linear-gradient(180deg, #fff 0%, #f3e9d0 40%, #d9b26f 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    /* 映画タイトル風の深い影 */
    text-shadow:
      0 4px 10px rgba(0,0,0,0.55),
      0 0 22px rgba(217,178,111,0.35);

    transform: translateY(-4px);
  }

  /* ★ ボタン：シネマティック（映画タイトル風） */
  .controls{
    display:flex; gap:14px; justify-content:center;
    margin:24px 0 8px 0; flex-wrap:wrap;
  }

  .btn{
    padding:14px 26px;
    border-radius:10px;
    border:0;
    cursor:pointer;
    font-weight:700;
    font-size:18px;
    min-width:180px;
    font-family: "Meiryo","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    transition: transform .12s ease, box-shadow .12s ease;
  }

  .btn.primary{
    background: linear-gradient(180deg, #f3e9d0 0%, #d9b26f 40%, #b08a4a 100%);
    color:#222;
    box-shadow:
      0 6px 14px rgba(0,0,0,0.45),
      inset 0 2px 2px rgba(255,255,255,0.8);
  }
  .btn.primary:hover{
    transform: translateY(-2px);
    box-shadow:
      0 10px 20px rgba(0,0,0,0.55),
      inset 0 2px 2px rgba(255,255,255,0.9);
  }
  .btn.primary:active{
    transform: translateY(2px);
    box-shadow:
      0 2px 6px rgba(0,0,0,0.35),
      inset 0 1px 1px rgba(255,255,255,0.6);
  }

  .btn.ghost{
    background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
    color:#dfe8ff;
    border:1px solid rgba(255,255,255,0.12);
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }
  .btn.ghost:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(0,0,0,0.35);
  }
  .btn.ghost:active{
    transform: translateY(2px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }

  .footer-note{
    margin-top:18px;
    font-size:12px;
    color:#9fb0ff;
    opacity:0.85;
  }

  /* 落下絵文字 */
  .falling-wrap{ position:absolute; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  .falling{
    position:absolute; top:-120px; font-size:44px; opacity:0.95;
    animation: fall linear forwards;
    text-shadow: 0 6px 18px rgba(0,0,0,0.45);
  }
  @keyframes fall{
    0%{ transform: translateY(-160px) rotate(0deg) scale(0.9); opacity:0.95; }
    100%{ transform: translateY(120vh) rotate(360deg) scale(1); opacity:0.02; }
  }

  @media (max-width:560px){
    .title{ font-size:40px; }
    .btn{ min-width:150px; padding:12px 18px; font-size:16px; }
    .falling{ font-size:34px; }
  }
</style>
</head>
<body>

<div class="start-screen" id="start-screen">
  <div class="bg-blob"></div>

  <div class="start-inner">
    <h1 class="title">人狼ノート</h1>

    <div class="controls">
      <button id="start-btn" class="btn primary">▶ 推理を始める</button>
      <button id="continue-btn" class="btn ghost" style="display:none;">続きから</button>
    </div>

    <div class="footer-note">バージョン 0.1</div>
  </div>

  <div class="falling-wrap" id="falling-wrap"></div>
</div>

<script>
(function(){
  const FALL_INTERVAL = 300;
  const FALL_DURATION_MIN = 4200;
  const FALL_DURATION_MAX = 9000;
  const EMOJIS = ["🐺","👨‍🌾","🔮","🕯️","🛡️","🤡","🦊","🧙","🗡️","🏮","🌕","📜"];
  const INITIAL_BURST = 12;

  const startBtn = document.getElementById('start-btn');
  const continueBtn = document.getElementById('continue-btn');
  const fallingWrap = document.getElementById('falling-wrap');
  const startScreen = document.getElementById('start-screen');

  const clickAudio = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=");

  try {
    const hasState = !!localStorage.getItem("jinroState");
    if (hasState) continueBtn.style.display = "inline-block";
  } catch (e) {}

  startBtn.addEventListener('click', () => {
    clickAudio.currentTime = 0;
    clickAudio.play().catch(()=>{});

    startScreen.style.transition = "opacity .42s ease, transform .42s ease";
    startScreen.style.opacity = "0";
    startScreen.style.transform = "scale(.995)";

    setTimeout(() => {
      startScreen.style.display = "none";
      if (typeof onStart === "function") onStart();
      else location.href = "game.html";
    }, 420);
  });

  continueBtn.addEventListener('click', () => {
    clickAudio.currentTime = 0;
    clickAudio.play().catch(()=>{});
    if (typeof onContinue === "function") onContinue();
    else location.href = "game.html?continue=true";
  });

  function createFalling() {
    const el = document.createElement('div');
    el.className = 'falling';
    el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

    const left = Math.random() * 92 + 4;
    el.style.left = left + 'vw';

    const dur = FALL_DURATION_MIN + Math.random() * (FALL_DURATION_MAX - FALL_DURATION_MIN);
    el.style.animationDuration = (dur / 1000) + 's';

    const scale = 0.85 + Math.random() * 0.6;
    el.style.transform = `scale(${scale})`;

    el.style.opacity = (0.6 + Math.random() * 0.4).toString();

    fallingWrap.appendChild(el);

    setTimeout(() => {
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }, dur + 300);
  }

  const fallTimer = setInterval(createFalling, FALL_INTERVAL);

  for (let i=0;i<INITIAL_BURST;i++){
    setTimeout(createFalling, i * 120);
  }

  startBtn.addEventListener('keyup', (e) => { if (e.key === 'Enter') startBtn.click(); });

  window.addEventListener('beforeunload', () => {
    clearInterval(fallTimer);
  });

})();
</script>
</body>
</html>
